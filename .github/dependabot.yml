version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
